name = "tuios"
description = "A terminal window manager that knows what your agents are doing."
homepage = "https://github.com/Gaurav-Gosain/tuios"
alternatives = [ "herdr",]
version = "0.12.1"
updated = "2026-11-01"
package-url = "https://github.com/Gaurav-Gosain/tuios/releases/download/v{{version}}/tuios_{{version}}_Linux_x86_64.tar.gz"

[extract]
strip = 0

[[extract.files]]
source = "tuios"
target = "{{vars.bin-path}}/tuios"
mode = "0755"

#
# build configuration
#

[build]
package-url = "https://github.com/Gaurav-Gosain/tuios/releases/download/v{{version}}/tuios_{{version}}_Linux_x86_64.tar.gz"

[[build.publish]]
repository-name = "packages"
repository-path = "tuios"
files = ["tuios_{{version}}_Linux_x86_64.tar.gz"]

