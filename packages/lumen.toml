name = "lumen"
description = "Beautiful git diff viewer, generate commits with AI, get summary of changes, all from the CLI"
homepage = "https://github.com/jnsahaj/lumen"
alternatives = [ ]
version = "2.32.0"
updated = "2026-11-21"
