name = "dotenvx"
description = "a better dotenv–from the creator of `dotenv`"
homepage = "https://dotenvx.com"
alternatives = [ "cat",]
version = "2.24.1"
updated = "2026-09-12"
package-url = "https://github.com/dotenvx/dotenvx/releases/download/v{{version}}/dotenvx-{{version}}-linux-x86_64.tar.gz"

[extract]
strip = 0

[[extract.files]]
source = "dotenvx"
target = "{{vars.bin-path}}/dotenvx"
mode = "0755"
